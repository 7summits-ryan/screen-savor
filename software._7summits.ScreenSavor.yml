# Local development manifest — builds from the working tree.
# The Flathub submission uses an identical manifest with a pinned git source.
id: software._7summits.ScreenSavor
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk
command: software._7summits.ScreenSavor
finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  # Idle detection. KDE and wlroots are handled by the ext-idle-notify-v1 Wayland
  # protocol, which rides the socket above and so needs nothing declared here.
  # GNOME implements no idle protocol - not ext-idle-notify-v1, and not
  # org.freedesktop.ScreenSaver.GetSessionIdleTime (it returns NotSupported) - and the
  # Inhibit portal only reports the session screensaver, not a configurable timeout.
  # Mutter's own interface is the only thing left there.
  - --talk-name=org.gnome.Mutter.IdleMonitor
  # A polled last resort for desktops with neither of the above. KDE owns this name
  # but answers NotSupported, so it is not the KDE path despite the name.
  - --talk-name=org.freedesktop.ScreenSaver
  # The tray icon, as a StatusNotifierItem. KDE implements the watcher itself; on
  # GNOME it comes from the AppIndicator extension, and where there is neither the
  # app falls back to the background portal, which needs nothing declared here.
  # The item is published as a subname of the application id, which Flatpak already
  # lets us own, so talking to the watcher is the only permission needed.
  - --talk-name=org.kde.StatusNotifierWatcher
  # Deliberately no --filesystem. The Video Clock saver plays a video the user
  # chooses, but it is chosen through Gtk.FileDialog, which is the file chooser
  # portal in here - the portal registers the pick with the document portal and
  # grants access to that one file, persistently, so it is still playable on
  # later runs. Nothing else on the disk needs to be reachable.
  #
  # Nor is there a codec extension. org.gnome.Platform//50 already declares
  # org.freedesktop.Platform.codecs-extra, which installs alongside the runtime
  # and puts a full libavcodec - H.265 and the rest - on the GStreamer plugin
  # path, so an MP4 out of a phone decodes without anything added here.
modules:
  - name: screen-savor
    buildsystem: meson
    sources:
      - type: dir
        path: .
