app-id: software.sevensummits.screensavor
runtime: org.gnome.Platform
runtime-version: '46'
sdk: org.gnome.Sdk
command: software.sevensummits.screensavor
finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  - --talk-name=org.gnome.Mutter.IdleMonitor
modules:
  - name: screensavers
    buildsystem: meson
    sources:
      - type: dir
        path: .
